[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-identity-access-mock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.11",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
identity_access_mock = ["fixtures.json"]
