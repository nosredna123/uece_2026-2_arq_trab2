[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-notification-mock"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pika==1.3.2",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]
