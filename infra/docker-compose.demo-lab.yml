services:
  demo-web:
    environment:
      DEMO_LAB_ENABLED: ${DEMO_LAB_ENABLED:?Set DEMO_LAB_ENABLED in infra/.env}
      DEMO_LAB_FIXTURES_PATH: ${DEMO_LAB_FIXTURES_PATH:?Set DEMO_LAB_FIXTURES_PATH in infra/.env}
      DEMO_LAB_MAX_PARTICIPANTS: ${DEMO_LAB_MAX_PARTICIPANTS:?Set DEMO_LAB_MAX_PARTICIPANTS in infra/.env}
      DEMO_LAB_MAX_CONCURRENCY: ${DEMO_LAB_MAX_CONCURRENCY:?Set DEMO_LAB_MAX_CONCURRENCY in infra/.env}
      DEMO_LAB_RUN_TIMEOUT_SECONDS: ${DEMO_LAB_RUN_TIMEOUT_SECONDS:?Set DEMO_LAB_RUN_TIMEOUT_SECONDS in infra/.env}
      DEMO_LAB_SETTLE_TIMEOUT_SECONDS: ${DEMO_LAB_SETTLE_TIMEOUT_SECONDS:?Set DEMO_LAB_SETTLE_TIMEOUT_SECONDS in infra/.env}
      DEMO_LAB_RUN_TTL_SECONDS: ${DEMO_LAB_RUN_TTL_SECONDS:?Set DEMO_LAB_RUN_TTL_SECONDS in infra/.env}
      DEMO_LAB_MAX_RETAINED_RUNS: ${DEMO_LAB_MAX_RETAINED_RUNS:?Set DEMO_LAB_MAX_RETAINED_RUNS in infra/.env}
    volumes:
      - ../mocks/identity-access/scenario-participants.json:/run/eventhub/scenario-participants.json:ro
