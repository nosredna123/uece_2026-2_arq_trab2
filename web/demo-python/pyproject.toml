[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-demo-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.11",
  "httpx==0.28.1",
  "Jinja2==3.1.6",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demo_web = ["templates/*.html", "templates/partials/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
