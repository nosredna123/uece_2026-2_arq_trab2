spring:
  application:
    name: event-management
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    user: ${MIGRATION_USER}
    password: ${MIGRATION_PASSWORD}
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
integration:
  identity-base-url: ${IDENTITY_BASE_URL}
  internal-service-key: ${INTERNAL_SERVICE_KEY}
  registration-service-key: ${REGISTRATION_SERVICE_KEY}
  http-timeout-seconds: ${HTTP_TIMEOUT_SECONDS}
  retry-initial-seconds: ${MESSAGE_RETRY_INITIAL_SECONDS}
  retry-max-seconds: ${MESSAGE_RETRY_MAX_SECONDS}
eventhub:
  messaging:
    enabled: true
