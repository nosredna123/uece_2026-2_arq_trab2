spring:
  application:
    name: registration
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  flyway:
    user: ${MIGRATION_USER}
    password: ${MIGRATION_PASSWORD}
    validate-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
policy:
  reservation-expiry-minutes: ${RESERVATION_EXPIRY_MINUTES}
  waitlist-enabled: ${WAITLIST_ENABLED}
  waitlist-offer-expiry-minutes: ${WAITLIST_OFFER_EXPIRY_MINUTES}
  cancellation-window-days: ${CANCELLATION_WINDOW_DAYS}
  refund-percentage: ${REFUND_PERCENTAGE}
integration:
  identity-base-url: ${IDENTITY_BASE_URL}
  event-management-base-url: ${EVENT_MANAGEMENT_BASE_URL}
  internal-service-key: ${INTERNAL_SERVICE_KEY}
  http-timeout-seconds: ${HTTP_TIMEOUT_SECONDS}
  retry-initial-seconds: ${MESSAGE_RETRY_INITIAL_SECONDS}
  retry-max-seconds: ${MESSAGE_RETRY_MAX_SECONDS}
