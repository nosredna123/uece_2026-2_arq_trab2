spring:
  datasource:
    url: jdbc:h2:mem:registration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

integration:
  identity-base-url: http://identity-mock:8080
  event-management-base-url: http://event-management:8080
  internal-service-key: synthetic-unit-only
  registration-service-key: synthetic-registration-unit-only
  http-timeout-seconds: 5
  retry-initial-seconds: 1
  retry-max-seconds: 60

policy:
  reservation-expiry-minutes: 30
  waitlist-enabled: true
  waitlist-offer-expiry-minutes: 30
  cancellation-window-days: 7
  refund-percentage: 90
