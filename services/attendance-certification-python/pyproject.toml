[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eventhub-attendance-certification"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.11",
  "uvicorn==0.34.0",
  "SQLAlchemy==2.0.39",
  "alembic==1.15.1",
  "psycopg[binary]==3.2.6",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "httpx==0.28.1", "hypothesis==6.127.8"]

[tool.setuptools.packages.find]
where = ["src"]
